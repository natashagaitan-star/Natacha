<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" role="img" aria-label="She Holds the Moon">
  <defs>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b95c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8b95c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- midnight field -->
  <rect width="960" height="1200" fill="#161b36"/>
  <g filter="url(#paint)">
    <path d="M-40 -30 L1000 -30 L1000 360 Q560 440 240 380 T-40 400 Z" fill="#1d2447" opacity="0.95"/>
    <path d="M-40 760 Q400 680 700 760 T1000 740 L1000 1240 L-40 1240 Z" fill="#121631" opacity="0.95"/>
    <path d="M-40 480 q300 -70 520 0 q-220 80 -520 30 z" fill="#262e59" opacity="0.6"/>
  </g>

  <!-- scattered stars -->
  <g fill="#efe7d2">
    <circle cx="120" cy="140" r="3.4" opacity="0.85"/><circle cx="240" cy="90" r="2.6" opacity="0.6"/>
    <circle cx="820" cy="120" r="3.2" opacity="0.8"/><circle cx="880" cy="300" r="2.6" opacity="0.55"/>
    <circle cx="90" cy="420" r="2.8" opacity="0.6"/><circle cx="700" cy="70" r="2.4" opacity="0.5"/>
    <circle cx="860" cy="960" r="2.8" opacity="0.5"/><circle cx="100" cy="1080" r="3" opacity="0.6"/>
    <circle cx="540" cy="110" r="2.8" opacity="0.65"/><circle cx="420" cy="60" r="2.2" opacity="0.5"/>
  </g>

  <!-- moon glow -->
  <circle cx="480" cy="430" r="330" fill="url(#moonGlow)"/>

  <!-- the figure -->
  <g filter="url(#paint)">
    <!-- gown / body: one grounded monumental form -->
    <path d="M480 520
             C400 540 356 610 340 700
             C320 812 300 930 276 1060
             C260 1150 300 1210 380 1210
             L580 1210
             C660 1210 700 1150 684 1060
             C660 930 640 812 620 700
             C604 610 560 540 480 520 Z"
          fill="#b0755e"/>
    <path d="M480 520 C420 536 380 596 366 676 C350 770 336 866 318 972 L642 972 C624 866 610 770 594 676 C580 596 540 536 480 520 Z"
          fill="#c69b92" opacity="0.75"/>
    <!-- head, bowed slightly toward the moon -->
    <ellipse cx="472" cy="470" rx="52" ry="60" fill="#c69b92"/>
    <path d="M420 452 q30 -50 88 -34 q30 8 30 40 q-2 30 -18 44 q-4 -50 -46 -56 q-34 -6 -54 6z" fill="#3a2e35"/>
    <!-- hair falling -->
    <path d="M428 468 q-26 60 -14 132 q10 52 -6 84 q40 6 52 -30 q14 -44 4 -104 q-6 -50 -36 -82z" fill="#3a2e35" opacity="0.95"/>
    <!-- arms cradling upward -->
    <path d="M368 640 C330 560 356 470 430 408 q18 -14 34 -20 l16 34 q-56 30 -74 92 c-12 40 -8 86 4 118 z" fill="#b0755e"/>
    <path d="M596 646 C632 566 610 476 540 412 q-18 -16 -36 -22 l-14 34 q54 32 70 94 c10 40 6 86 -6 120 z" fill="#a97466"/>
    <!-- hands, simple mitt shapes touching the moon -->
    <ellipse cx="452" cy="392" rx="26" ry="18" fill="#c69b92" transform="rotate(-24 452 392)"/>
    <ellipse cx="516" cy="394" rx="26" ry="18" fill="#c69b92" transform="rotate(22 516 394)"/>
  </g>

  <!-- the moon, seven layers of ochre reading as one -->
  <g filter="url(#paint)">
    <circle cx="484" cy="330" r="96" fill="#e0a94f"/>
    <circle cx="484" cy="330" r="96" fill="none" stroke="#f2d391" stroke-width="8" opacity="0.6"/>
    <!-- crescent shading, lower right — light arriving from upper left -->
    <path d="M552 264 a96 96 0 0 1 -46 158 a72 72 0 0 0 46 -158" fill="#b57f2e" opacity="0.45"/>
    <path d="M420 288 q26 -34 74 -40" stroke="#f2d391" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.75"/>
    <circle cx="446" cy="352" r="9" fill="#b57f2e" opacity="0.4"/>
    <circle cx="492" cy="386" r="6" fill="#b57f2e" opacity="0.35"/>
  </g>

  <rect width="960" height="1200" filter="url(#grain)" opacity="0.5" fill="#000" fill-opacity="0"/>
</svg>
