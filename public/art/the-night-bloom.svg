<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="The Night Bloom">
  <defs>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
    <filter id="paint2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- night ground -->
  <rect width="900" height="1200" fill="#1c2440"/>
  <g filter="url(#paint)">
    <path d="M-40 180 Q300 90 560 170 T960 140 L960 620 Q560 700 300 630 T-40 660 Z" fill="#2a3a8c" opacity="0.85"/>
    <path d="M-40 560 Q260 480 520 560 T960 540 L960 1240 L-40 1240 Z" fill="#232e63" opacity="0.9"/>
    <path d="M-40 900 Q320 820 640 910 T960 880 L960 1240 L-40 1240 Z" fill="#1a2148" opacity="0.9"/>
    <!-- deep charcoal band, high -->
    <path d="M-40 -20 L960 -20 L960 150 Q520 210 180 160 T-40 180 Z" fill="#22242e"/>
  </g>

  <!-- drifting pale washes -->
  <g filter="url(#paint2)" opacity="0.35">
    <path d="M60 700 q140 -40 260 10 q-120 50 -260 20 z" fill="#8d9bc9"/>
    <path d="M520 1020 q160 -50 300 0 q-150 60 -300 30 z" fill="#7f8cba"/>
  </g>

  <!-- star rows in the charcoal band -->
  <g fill="#efe7d2">
    <g opacity="0.9">
      <circle cx="150" cy="70" r="4"/><circle cx="200" cy="64" r="3.4"/><circle cx="252" cy="74" r="4.2"/>
      <circle cx="306" cy="62" r="3.2"/><circle cx="360" cy="72" r="4"/><circle cx="416" cy="60" r="3.6"/>
      <circle cx="470" cy="70" r="4.2"/><circle cx="526" cy="62" r="3.2"/><circle cx="580" cy="74" r="3.8"/>
    </g>
    <g opacity="0.75">
      <circle cx="230" cy="112" r="3.2"/><circle cx="292" cy="120" r="3.8"/><circle cx="356" cy="110" r="3"/>
      <circle cx="420" cy="122" r="3.6"/><circle cx="484" cy="112" r="3"/><circle cx="548" cy="120" r="3.4"/>
    </g>
    <g opacity="0.5">
      <circle cx="120" cy="300" r="3"/><circle cx="800" cy="260" r="3.4"/><circle cx="740" cy="980" r="3"/>
      <circle cx="110" cy="1060" r="3.2"/><circle cx="820" cy="1120" r="2.8"/><circle cx="90" cy="480" r="2.8"/>
    </g>
  </g>

  <!-- the bloom -->
  <g filter="url(#paint)">
    <g transform="translate(470 690)">
      <!-- petals -->
      <g fill="#d5452c">
        <path d="M0 0 C-60 -180 -30 -330 30 -400 C90 -320 80 -160 30 -20 Z"/>
        <path d="M0 0 C90 -140 220 -220 330 -230 C300 -120 180 -30 40 20 Z"/>
        <path d="M0 0 C150 -20 290 30 360 120 C250 170 120 140 20 60 Z"/>
        <path d="M0 0 C120 90 190 210 190 330 C80 300 0 190 -20 70 Z"/>
        <path d="M0 0 C-30 130 -110 240 -230 290 C-250 180 -190 70 -60 10 Z"/>
        <path d="M0 0 C-140 40 -270 20 -350 -60 C-260 -140 -120 -120 -20 -50 Z"/>
        <path d="M0 0 C-120 -90 -180 -210 -160 -330 C-60 -290 20 -170 30 -60 Z"/>
      </g>
      <!-- warmer inner petals -->
      <g fill="#e8622f" opacity="0.85">
        <path d="M0 0 C-40 -120 -20 -230 20 -280 C60 -220 55 -110 20 -15 Z"/>
        <path d="M0 0 C70 -90 160 -140 240 -150 C215 -75 125 -15 30 15 Z"/>
        <path d="M0 0 C80 70 130 150 135 240 C60 215 5 130 -12 50 Z"/>
        <path d="M0 0 C-95 25 -185 10 -245 -45 C-180 -100 -85 -85 -15 -35 Z"/>
      </g>
      <!-- seed centres: ochre orbs with dark pips -->
      <g>
        <g transform="translate(0 -6)">
          <circle r="46" fill="#e0a33e"/><circle r="46" fill="none" stroke="#8a5a1d" stroke-width="5" opacity="0.5"/>
          <circle cx="4" cy="2" r="9" fill="#241c12"/>
        </g>
        <g transform="translate(52 -190)"><circle r="30" fill="#dda03c"/><circle cx="2" cy="1" r="6.5" fill="#241c12"/></g>
        <g transform="translate(196 -128)"><circle r="27" fill="#e0a33e"/><circle cx="-2" cy="2" r="6" fill="#241c12"/></g>
        <g transform="translate(236 42)"><circle r="30" fill="#d99b38"/><circle cx="2" cy="-2" r="6.5" fill="#241c12"/></g>
        <g transform="translate(118 214)"><circle r="26" fill="#e0a33e"/><circle cx="1" cy="2" r="6" fill="#241c12"/></g>
        <g transform="translate(-118 172)"><circle r="29" fill="#dda03c"/><circle cx="-2" cy="1" r="6.4" fill="#241c12"/></g>
        <g transform="translate(-226 -34)"><circle r="26" fill="#d99b38"/><circle cx="2" cy="2" r="5.8" fill="#241c12"/></g>
        <g transform="translate(-96 -216)"><circle r="28" fill="#e0a33e"/><circle cx="1" cy="-2" r="6.2" fill="#241c12"/></g>
        <g transform="translate(-30 -320)"><circle r="20" fill="#dda03c"/><circle r="4.6" cx="1" cy="1" fill="#241c12"/></g>
        <g transform="translate(146 -260)"><circle r="18" fill="#d99b38"/><circle r="4.2" cx="-1" cy="1" fill="#241c12"/></g>
      </g>
    </g>
    <!-- a stray seed drifting off, garden logic -->
    <g transform="translate(760 380)"><circle r="16" fill="#dda03c"/><circle r="4" cx="1" cy="1" fill="#241c12"/></g>
    <g transform="translate(150 940)"><circle r="14" fill="#c0913f" opacity="0.9"/><circle r="3.6" fill="#241c12"/></g>
  </g>

  <rect width="900" height="1200" filter="url(#grain)" opacity="0.5" fill="#000" fill-opacity="0"/>
</svg>
