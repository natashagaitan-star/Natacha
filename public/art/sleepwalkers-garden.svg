<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Sleepwalker's Garden">
  <defs>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="91" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="orb" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0c46a"/>
      <stop offset="70%" stop-color="#d99b38"/>
      <stop offset="100%" stop-color="#a26d24"/>
    </radialGradient>
  </defs>

  <!-- deep night garden -->
  <rect width="900" height="1200" fill="#131b2c"/>
  <g filter="url(#paint)">
    <path d="M-40 -30 L940 -30 L940 220 Q520 290 200 230 T-40 250 Z" fill="#1a2340" opacity="0.9"/>
    <!-- foliage masses -->
    <path d="M-40 320 Q160 180 340 300 Q420 350 380 470 Q280 560 120 520 Q-20 480 -40 400 Z" fill="#1f3a2d"/>
    <path d="M520 260 Q700 160 880 280 Q960 340 900 460 Q780 560 620 500 Q500 440 520 260 Z" fill="#24402f"/>
    <path d="M-40 620 Q200 520 420 620 Q560 690 520 820 Q380 920 160 860 Q-20 800 -40 700 Z" fill="#182f24"/>
    <path d="M480 640 Q700 560 920 660 L940 680 L940 980 Q720 1040 540 960 Q420 880 480 640 Z" fill="#20372b"/>
    <path d="M-40 940 Q260 860 560 950 Q780 1010 940 960 L940 1240 L-40 1240 Z" fill="#122019"/>
    <!-- leaf strokes -->
    <g stroke="#3d6247" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M140 380 q60 -60 140 -50"/>
      <path d="M620 360 q80 -50 160 -30"/>
      <path d="M220 720 q70 -50 150 -40"/>
      <path d="M600 780 q90 -40 170 -20"/>
      <path d="M340 1020 q80 -50 170 -40"/>
    </g>
    <!-- stems reaching -->
    <g stroke="#2c4a37" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M300 460 q30 -90 -10 -170"/>
      <path d="M700 520 q40 -100 10 -190"/>
      <path d="M480 860 q20 -80 -14 -150"/>
      <path d="M180 900 q34 -80 6 -160"/>
    </g>
  </g>

  <!-- the glowing orbs: fruit, lanterns, small lost planets -->
  <g filter="url(#paint)">
    <circle cx="292" cy="270" r="44" fill="url(#orb)"/>
    <circle cx="712" cy="312" r="52" fill="url(#orb)"/>
    <circle cx="466" cy="694" r="40" fill="url(#orb)"/>
    <circle cx="172" cy="726" r="34" fill="url(#orb)"/>
    <circle cx="806" cy="740" r="30" fill="url(#orb)"/>
    <circle cx="352" cy="1024" r="46" fill="url(#orb)"/>
    <circle cx="652" cy="1010" r="30" fill="url(#orb)"/>
  </g>
  <!-- their small dark pips -->
  <g fill="#241c12">
    <circle cx="296" cy="272" r="9"/><circle cx="716" cy="314" r="10.4"/><circle cx="470" cy="696" r="8.4"/>
    <circle cx="175" cy="728" r="7.2"/><circle cx="808" cy="742" r="6.4"/><circle cx="356" cy="1026" r="9.4"/>
    <circle cx="654" cy="1012" r="6.4"/>
  </g>

  <!-- night sky pinpricks above the hedge -->
  <g fill="#efe7d2">
    <circle cx="140" cy="110" r="3" opacity="0.7"/><circle cx="420" cy="80" r="2.6" opacity="0.6"/>
    <circle cx="620" cy="130" r="3.2" opacity="0.75"/><circle cx="800" cy="90" r="2.6" opacity="0.6"/>
    <circle cx="260" cy="160" r="2.4" opacity="0.5"/><circle cx="880" cy="180" r="2.8" opacity="0.6"/>
  </g>

  <rect width="900" height="1200" filter="url(#grain)" opacity="0.5" fill="#000" fill-opacity="0"/>
</svg>
