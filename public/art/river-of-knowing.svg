<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="River of Knowing">
  <defs>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- pale sky -->
  <rect width="1200" height="750" fill="#e7dcc6"/>
  <g filter="url(#paint)">
    <path d="M-40 -30 L1240 -30 L1240 150 Q640 210 260 160 T-40 180 Z" fill="#ddd0e0" opacity="0.7"/>
    <!-- far hills -->
    <path d="M-40 200 Q200 130 460 190 Q700 240 940 170 Q1100 130 1240 180 L1240 760 L-40 760 Z" fill="#c9a67c" opacity="0.9"/>
    <!-- middle land -->
    <path d="M-40 330 Q260 260 560 330 Q860 400 1240 310 L1240 760 L-40 760 Z" fill="#b0755e"/>
    <!-- near land -->
    <path d="M-40 520 Q360 450 720 530 Q980 580 1240 520 L1240 760 L-40 760 Z" fill="#8e5a42"/>
    <!-- the river: one committed indigo channel -->
    <path d="M1240 240
             C1020 260 900 320 780 360
             C640 408 560 380 460 420
             C340 468 320 540 260 600
             C210 650 140 690 40 710
             L-40 720 L-40 760 L400 760
             C420 700 470 660 540 630
             C640 588 760 600 860 550
             C980 490 1000 420 1100 380
             C1150 360 1200 350 1240 350 Z"
          fill="#272c4b"/>
    <!-- current lines -->
    <path d="M1140 300 q-160 30 -300 90" stroke="#4a548c" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M700 430 q-140 40 -240 120" stroke="#4a548c" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M380 600 q-110 60 -240 90" stroke="#8d84b8" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- river stones / islands -->
    <ellipse cx="880" cy="470" rx="30" ry="12" fill="#c9a67c"/>
    <ellipse cx="500" cy="560" rx="24" ry="10" fill="#c9a67c" opacity="0.9"/>
    <!-- small sun, low and pale -->
    <circle cx="180" cy="90" r="42" fill="#f3ead6"/>
    <circle cx="180" cy="90" r="42" fill="none" stroke="#c0913f" stroke-width="5" opacity="0.5"/>
  </g>

  <rect width="1200" height="750" filter="url(#grain)" opacity="0.5" fill="#000" fill-opacity="0"/>
</svg>
