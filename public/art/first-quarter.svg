<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-label="First Quarter">
  <defs>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="1200" fill="#191e3d"/>
  <g filter="url(#paint)">
    <path d="M-40 -30 L840 -30 L840 300 Q480 380 180 320 T-40 340 Z" fill="#232a55" opacity="0.9"/>
    <path d="M-40 840 Q320 760 560 840 T840 820 L840 1240 L-40 1240 Z" fill="#121527" opacity="0.95"/>
    <path d="M-40 480 q240 -60 440 0 q-200 70 -440 30 z" fill="#3d3a6b" opacity="0.5"/>
    <path d="M300 640 q260 -50 480 10 q-230 60 -480 20 z" fill="#8d84b8" opacity="0.22"/>
  </g>

  <!-- descending phases -->
  <g filter="url(#paint)">
    <!-- new -->
    <circle cx="400" cy="150" r="52" fill="none" stroke="#a79fc4" stroke-width="5" opacity="0.8"/>
    <!-- waxing crescent -->
    <g transform="translate(400 350)">
      <circle r="56" fill="#2a2f56"/>
      <path d="M18 -53 A56 56 0 0 1 18 53 A40 56 0 0 0 18 -53 Z" fill="#efe3c2"/>
    </g>
    <!-- first quarter, the protagonist, larger -->
    <g transform="translate(400 600)">
      <circle r="86" fill="#252b52"/>
      <path d="M0 -86 A86 86 0 0 1 0 86 Z" fill="#f3ead6"/>
      <circle r="86" fill="none" stroke="#c9b98c" stroke-width="4" opacity="0.6"/>
    </g>
    <!-- waxing gibbous -->
    <g transform="translate(400 852)">
      <circle r="56" fill="#efe3c2"/>
      <path d="M-14 -54 A56 56 0 0 0 -14 54 A70 56 0 0 1 -14 -54 Z" fill="#2a2f56"/>
    </g>
    <!-- full -->
    <circle cx="400" cy="1058" r="52" fill="#f3ead6"/>
    <circle cx="400" cy="1058" r="52" fill="none" stroke="#c9b98c" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- thread joining the beads -->
  <path d="M400 205 V 292 M400 408 V 512 M400 688 V 794 M400 910 V 1004" stroke="#c9b98c" stroke-width="2.4" opacity="0.5" filter="url(#paint)"/>

  <!-- stars -->
  <g fill="#efe7d2">
    <circle cx="130" cy="220" r="3" opacity="0.7"/><circle cx="660" cy="180" r="3.2" opacity="0.75"/>
    <circle cx="680" cy="470" r="2.6" opacity="0.55"/><circle cx="120" cy="560" r="2.8" opacity="0.6"/>
    <circle cx="650" cy="760" r="2.6" opacity="0.5"/><circle cx="150" cy="900" r="3" opacity="0.6"/>
    <circle cx="620" cy="1080" r="2.8" opacity="0.55"/><circle cx="200" cy="1120" r="2.4" opacity="0.5"/>
    <circle cx="90" cy="90" r="2.6" opacity="0.6"/><circle cx="700" cy="80" r="2.4" opacity="0.55"/>
  </g>

  <rect width="800" height="1200" filter="url(#grain)" opacity="0.5" fill="#000" fill-opacity="0"/>
</svg>
