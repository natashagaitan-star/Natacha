<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Venus Rising">
  <defs>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- dusk lavender sky -->
  <rect width="900" height="1200" fill="#b6aed0"/>
  <g filter="url(#paint)">
    <path d="M-40 -30 L940 -30 L940 240 Q520 310 200 250 T-40 270 Z" fill="#c7bfdc" opacity="0.9"/>
    <path d="M-40 300 Q360 240 700 320 T940 300 L940 560 Q520 620 180 560 T-40 580 Z" fill="#a293c4" opacity="0.7"/>
    <!-- dark water, holding its breath -->
    <path d="M-40 760 Q300 720 560 760 T940 750 L940 1240 L-40 1240 Z" fill="#232a55"/>
    <path d="M-40 800 q260 -30 520 10 q220 30 460 -10 l0 60 q-460 50 -980 0 z" fill="#161b36" opacity="0.8"/>
  </g>

  <!-- the figure, surfacing -->
  <g filter="url(#paint)">
    <!-- halo: one pass of true gold -->
    <circle cx="450" cy="330" r="118" fill="none" stroke="#c9a04e" stroke-width="7"/>
    <!-- torso rising from the waterline -->
    <path d="M450 380
             C400 392 372 440 362 510
             C352 580 346 660 340 764
             L560 764
             C554 660 548 580 538 510
             C528 440 500 392 450 380 Z"
          fill="#c69b92"/>
    <path d="M382 560 q70 -26 138 0 l-6 40 q-64 -22 -126 0 z" fill="#a97466" opacity="0.7"/>
    <!-- head -->
    <ellipse cx="450" cy="336" rx="50" ry="58" fill="#c69b92"/>
    <!-- hair, wet and long -->
    <path d="M404 314 q-20 90 -8 210 q6 70 -8 118 q36 10 50 -26 q18 -50 10 -140 q-6 -100 -44 -162z" fill="#3a2e35"/>
    <path d="M496 314 q22 92 10 214 q-6 68 8 114 q-36 10 -50 -26 q-18 -50 -10 -140 q6 -100 42 -162z" fill="#3a2e35" opacity="0.95"/>
    <path d="M402 306 q40 -46 96 -2 q6 26 -6 40 q-10 -40 -44 -44 q-30 -4 -46 6z" fill="#3a2e35"/>
    <!-- shoulders / arms folded low, still under water-line calm -->
    <path d="M362 508 C320 520 296 560 288 610 q60 18 96 -6 q22 -46 -24 -104z" fill="#c69b92" opacity="0.9"/>
    <path d="M538 508 C580 520 604 560 612 610 q-60 18 -96 -6 q-22 -46 24 -104z" fill="#b98a80" opacity="0.9"/>
    <!-- waterline crossing the figure -->
    <path d="M-40 770 q260 -26 520 8 q220 28 460 -8 l0 30 q-480 44 -980 0 z" fill="#272c4b"/>
    <!-- ripples where she breaks the surface -->
    <ellipse cx="450" cy="778" rx="180" ry="16" fill="none" stroke="#8d84b8" stroke-width="5" opacity="0.6"/>
    <ellipse cx="450" cy="790" rx="260" ry="22" fill="none" stroke="#8d84b8" stroke-width="4" opacity="0.35"/>
  </g>

  <!-- evening star, in attendance -->
  <circle cx="720" cy="140" r="6" fill="#f3ead6"/>
  <circle cx="720" cy="140" r="12" fill="none" stroke="#f3ead6" stroke-width="1.6" opacity="0.5"/>

  <rect width="900" height="1200" filter="url(#grain)" opacity="0.5" fill="#000" fill-opacity="0"/>
</svg>
