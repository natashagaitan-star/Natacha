<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="Natasha Valentina in her studio at dusk, seen from behind at the easel">
  <defs>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="47"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- dusk studio -->
  <rect width="900" height="1100" fill="#3a3550"/>
  <g filter="url(#paint)">
    <path d="M-40 -30 L940 -30 L940 300 Q520 360 200 310 T-40 330 Z" fill="#4a4463" opacity="0.9"/>
    <!-- window with evening sky -->
    <rect x="580" y="120" width="240" height="340" fill="#8d84b8"/>
    <rect x="580" y="120" width="240" height="140" fill="#a79fc4" opacity="0.8"/>
    <rect x="580" y="120" width="240" height="340" fill="none" stroke="#26231f" stroke-width="14"/>
    <line x1="700" y1="120" x2="700" y2="460" stroke="#26231f" stroke-width="10"/>
    <circle cx="650" cy="200" r="22" fill="#f3ead6"/>
    <!-- floor -->
    <path d="M-40 780 L940 780 L940 1140 L-40 1140 Z" fill="#5c4a3d"/>
    <path d="M-40 820 q460 -18 980 0" stroke="#4a3a30" stroke-width="8" fill="none" opacity="0.7"/>
    <path d="M-40 920 q460 -14 980 0" stroke="#4a3a30" stroke-width="8" fill="none" opacity="0.6"/>
    <!-- easel + canvas in progress -->
    <rect x="150" y="240" width="300" height="400" fill="#e7dcc6"/>
    <rect x="150" y="240" width="300" height="400" fill="none" stroke="#8a7350" stroke-width="10"/>
    <!-- the work on the easel: an indigo field being born -->
    <path d="M170 300 q140 -40 260 10 l0 310 l-260 0 z" fill="#272c4b"/>
    <circle cx="320" cy="380" r="44" fill="#e0a94f"/>
    <path d="M170 560 q130 -30 260 6" stroke="#c07a68" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- easel legs -->
    <path d="M190 640 L140 920 M410 640 L460 920 M300 660 L300 940" stroke="#6b543a" stroke-width="16" stroke-linecap="round"/>
    <!-- the artist, from behind, brush raised -->
    <path d="M560 520
             C520 530 496 570 488 630
             C478 700 472 790 466 900
             C462 960 486 1000 540 1000
             C594 1000 618 960 614 900
             C608 790 602 700 592 630
             C584 570 600 530 560 520 Z" fill="#7a4a5a"/>
    <ellipse cx="548" cy="478" rx="42" ry="48" fill="#c69b92"/>
    <!-- hair gathered -->
    <path d="M512 462 q30 -44 76 -24 q22 10 18 40 q-4 26 -18 36 q-2 -42 -38 -48 q-26 -6 -38 -4z" fill="#3a2e35"/>
    <circle cx="560" cy="410" r="26" fill="#3a2e35"/>
    <!-- raised arm with brush toward canvas -->
    <path d="M516 560 C470 540 430 500 410 450" stroke="#c69b92" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M410 450 L382 404" stroke="#8a5a1d" stroke-width="9" stroke-linecap="round"/>
    <path d="M382 404 L370 382" stroke="#d5452c" stroke-width="12" stroke-linecap="round"/>
    <!-- jars and pigments on a stool -->
    <rect x="700" y="700" width="150" height="26" fill="#6b543a"/>
    <path d="M715 726 L710 900 M835 726 L840 900" stroke="#6b543a" stroke-width="12" stroke-linecap="round"/>
    <rect x="716" y="650" width="34" height="50" fill="#c0913f"/>
    <rect x="760" y="640" width="30" height="60" fill="#a24e36"/>
    <rect x="800" y="656" width="32" height="44" fill="#8d84b8"/>
  </g>

  <rect width="900" height="1100" filter="url(#grain)" opacity="0.5" fill="#000" fill-opacity="0"/>
</svg>
